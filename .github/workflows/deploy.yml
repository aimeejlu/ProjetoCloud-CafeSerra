
name: Deploy CafeSerra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build e Deploy na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar acesso SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar arquivos para EC2
        run: |
          scp -i ~/.ssh/id_ed25519 \
            index.html Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/cafeserra/

      - name: Construir imagem e atualizar container
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/cafeserra

            docker build -t cafeserra .

            docker rm -f cafeserra || true

            docker run -d \
              --name cafeserra \
              --restart unless-stopped \
              -p 80:80 \
              cafeserra
          EOF
